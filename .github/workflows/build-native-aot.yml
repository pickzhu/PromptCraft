name: Build Windows Native AOT & Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write  # 保证自动创建 Release 的权限

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. 安装与配置 .NET 10 环境
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 生成动态递增版本号 (格式: 1.0.构建号)
    # 改用通用的 bash 壳层运行，完美规避 PowerShell 复杂的符号定义和转义报错
    - name: Generate Dynamic Version
      id: versioning
      shell: bash
      run: |
        BUILD_NUM="\${{ github.run_number }}"
        DYNAMIC_VER="1.0.\${BUILD_NUM}"
        echo "APP_VERSION=\({DYNAMIC_VER}" >> \)GITHUB_OUTPUT
        echo "Generated Version: \${DYNAMIC_VER}"

    # 4. 使用 Native AOT 编译发布项目 (注入动态版本号)
    # 注意：通过 \(GITHUB_OUTPUT 拿到的变量在 Actions 里的格式为 \){{ steps.versioning.outputs.APP_VERSION }}
    - name: Dotnet Publish (Native AOT)
      run: |
        dotnet publish PromptCraft.Desktop/PromptCraft.Desktop.csproj -c Release -r win-x64 /p:PublishAot=true /p:PublishTrimmed=true /p:Version=\${{ steps.versioning.outputs.APP_VERSION }} --output ./publish

    # 5. 使用全新的稳定版 Inno Setup Action 制作安装包
    - name: Compile Inno Setup Script
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
      with:
        path: setup-script.iss
        options: /DAppVersion=\${{ steps.versioning.outputs.APP_VERSION }}

    # 6. 自动创建公开的 GitHub Release 并挂载安装包
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v\${{ steps.versioning.outputs.APP_VERSION }}
        name: Release v\${{ steps.versioning.outputs.APP_VERSION }}
        body: |
          ### 🚀 自动化构建成功
          - **触发分支**: `master`/`main`
          - **构建编号**: #\${{ github.run_number }}
          - **编译模式**: Windows x64 Native AOT
          
          该版本已由 GitHub Actions 自动打包并公开部署。
        draft: false
        prerelease: false
        files: ./output/*.exe
