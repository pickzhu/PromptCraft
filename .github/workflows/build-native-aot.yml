name: Build Windows Native AOT & Release

on:
  push:
    branches:
      - main  # 监听 main 分支的提交

permissions:
  contents: write  # 必须赋予写权限，否则无法自动创建 Release 并上传文件

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. 安装与配置 .NET 10 环境
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 生成动态递增版本号 (格式: 1.0.GitHub构建号)
    - name: Generate Dynamic Version
      id: versioning
      shell: powershell
      run: |
        buildNumber = "{{ github.run_number }}"
        dynamicVersion = "1.0.buildNumber"
        echo "APP_VERSION=dynamicVersion" >> env:GITHUB_OUTPUT
        Write-Host "Generated Version: \$dynamicVersion"

    # 4. 使用 Native AOT 编译发布项目 (将动态版本号注入到 .NET 程序中)
    - name: Dotnet Publish (Native AOT)
      run: |
        dotnet publish PromptCraft.Desktop/PromptCraft.Desktop.csproj -c Release -r win-x64 /p:PublishAot=true /p:PublishTrimmed=true /p:Version=\${{ steps.versioning.outputs.APP_VERSION }} --output ./publish

    # 5. 使用 Inno Setup 制作安装包
    - name: Compile Inno Setup Script
      uses: amake/innosetup-action@v1
      with:
        script: setup-script.iss
        options: /DAppVersion=\${{ steps.versioning.outputs.APP_VERSION }}

    # 6. 自动创建公开的 GitHub Release 并挂载安装包
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v\${{ steps.versioning.outputs.APP_VERSION }}
        name: Release v\${{ steps.versioning.outputs.APP_VERSION }}
        body: |
          ### 🚀 自动化构建成功
          - **触发分支**: `main`
          - **构建编号**: #\${{ github.run_number }}
          - **编译模式**: Windows x64 Native AOT
          
          该版本已由 GitHub Actions 自动打包并公开部署。
        draft: false
        prerelease: false
        files: ./output/*.exe
