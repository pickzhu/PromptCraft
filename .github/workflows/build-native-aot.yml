name: Build Windows Native AOT & Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write  # 保证自动创建 Release 的权限

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. 安装与配置 .NET 10 环境
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 生成动态递增版本号 (格式: 1.0.构建号)
    # 采用 Windows 原生 PowerShell 环境，完美确保输出的字符串完全合规、无转义乱码
    - name: Generate Dynamic Version
      id: versioning
      shell: powershell
      run: |
        buildNum = "{{ github.run_number }}"
        dynamicVer = "1.0.buildNum"
        "APP_VERSION=dynamicVer" | Out-File -FilePath env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Successfully generated clean version: \$dynamicVer"

    # 4. 显式还原所有项目依赖
    - name: Restore NuGet Packages
      run: |
        dotnet restore PromptCraft.Desktop/PromptCraft.Desktop.csproj -r win-x64

    # 5. 使用 Native AOT 编译发布项目 (使用正确的动态版本变量)
    - name: Dotnet Publish (Native AOT)
      run: |
        dotnet publish PromptCraft.Desktop/PromptCraft.Desktop.csproj -c Release -r win-x64 /p:PublishAot=true /p:PublishTrimmed=true /p:Version=\${{ steps.versioning.outputs.APP_VERSION }} --no-restore --output ./publish

    # 6. 使用稳定版 Inno Setup Action 制作安装包
    - name: Compile Inno Setup Script
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
      with:
        path: setup-script.iss
        options: /DAppVersion=\${{ steps.versioning.outputs.APP_VERSION }}

    # 7. 自动创建公开的 GitHub Release 并挂载安装包
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v\${{ steps.versioning.outputs.APP_VERSION }}
        name: Release v\${{ steps.versioning.outputs.APP_VERSION }}
        body: |
          ### 🚀 自动化构建成功
          - **触发分支**: `master`/`main`
          - **构建编号**: #\${{ github.run_number }}
          - **编译模式**: Windows x64 Native AOT
          
          该版本已由 GitHub Actions 自动打包并公开部署。
        draft: false
        prerelease: false
        files: ./output/*.exe
