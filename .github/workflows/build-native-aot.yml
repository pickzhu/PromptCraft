name: Build Windows Native AOT & Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 检出仓库代码
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. 安装与配置 .NET 10 环境
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 显式还原依赖 (干净的版本号，没有任何反斜杠)
    - name: Restore NuGet Packages
      run: dotnet restore PromptCraft.Desktop/PromptCraft.Desktop.csproj -r win-x64 /p:Version=1.0.\${{ github.run_number }}

    # 4. 使用 Native AOT 编译发布项目
    - name: Dotnet Publish (Native AOT)
      run: dotnet publish PromptCraft.Desktop/PromptCraft.Desktop.csproj -c Release -r win-x64 /p:PublishAot=true /p:PublishTrimmed=true /p:Version=1.0.\${{ github.run_number }} --no-restore --output ./publish

    # 5. 使用稳定版 Inno Setup Action 制作安装包
    - name: Compile Inno Setup Script
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
      with:
        path: setup-script.iss
        options: /DAppVersion=1.0.\${{ github.run_number }}

    # 6. 自动创建公开的 GitHub Release 并挂载安装包
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.\${{ github.run_number }}
        name: Release v1.0.\${{ github.run_number }}
        body: |
          ### 🚀 自动化构建成功
          - **触发分支**: `master`/`main`
          - **构建编号**: #\${{ github.run_number }}
          - **编译模式**: Windows x64 Native AOT
          
          该版本已由 GitHub Actions 自动打包并公开部署。
        draft: false
        prerelease: false
        files: ./output/*.exe
